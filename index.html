<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas tarefas</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="cartao-aplicacao">

        <header class="cabecalho-aplicacao">
            <h1>Minhas tarefas ✨</h1>

            <button class="botao-icone" id="botao-tema">
                <i class="fa-solid fa-moon"></i>
            </button>
        </header>

        <img src="imagem arthur.jpg" class="foto-perfil" alt="Foto de perfil">

        <div class="progresso">
            <h3>Meu progresso</h3>
            <p id="texto-progresso">0 de 0 tarefas concluídas</p>

            <div class="barra">
                <div id="preenchimento"></div>
            </div>

            <p id="porcentagem">0%</p>
        </div>

        <div class="caixa-entrada">
            <input
                type="text"
                id="campo-tarefa"
                placeholder="O que vamos fazer hoje?"
                maxlength="40"
            >

            <button class="botao-principal" id="botao-adicionar">
                <i class="fa-solid fa-plus"></i> Adicionar
            </button>
        </div>

        <div class="filtros">
            <button class="filtro ativo" data-filtro="todas">Todas</button>
            <button class="filtro" data-filtro="pendentes">Pendentes</button>
            <button class="filtro" data-filtro="concluidas">Concluídas</button>
        </div>

        <ul class="lista-tarefas" id="lista-tarefas"></ul>

        <footer>
            <span id="contador-tarefas">0 tarefas na lista</span>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
